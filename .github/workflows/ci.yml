name: CI

on:
  push:
    paths:
      - 'Source/**'
      - 'build/**'
      - '*.sln'
      - '*.props'
      - '*.targets'
      - 'global.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'Source/**'
      - 'build/**'
      - '*.sln'
      - '*.props'
      - '*.targets'
      - 'global.json'
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 5.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 5.0.x

      - name: Setup .NET 6.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run Nuke Build
        run: chmod +x build.sh && ./build.sh
